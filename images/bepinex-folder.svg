<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="344" viewBox="0 0 760 344" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <g id="folder"><path d="M0 2 h7 l2 2 h11 v12 h-20z" fill="#e3b341" stroke="#b08800" stroke-width="0.8"/></g>
    <g id="file"><path d="M2 0 h10 l4 4 v14 h-14z" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><path d="M12 0 v4 h4" fill="none" stroke="#8c959f"/></g>
    <g id="exe"><rect x="0" y="1" width="18" height="15" rx="2" fill="#57606a"/><rect x="2" y="4" width="14" height="10" fill="#9ecbff"/></g>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="343" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#1f2328">Step 2 · Your Outward_Defed folder after installing BepInEx</text>

  <!-- Correct -->
  <rect x="20" y="44" width="350" height="286" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="34" y="68" font-size="14" font-weight="600" fill="#1a7f37">✔ Correct</text>
  <rect x="34" y="80" width="322" height="24" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="44" y="97" font-size="12" fill="#57606a">… › common › Outward › Outward_Defed</text>

  <rect x="30" y="111" width="330" height="26" rx="4" fill="#dafbe1"/>
  <use xlink:href="#folder" x="42" y="114"/><text x="72" y="129" font-size="13" fill="#1f2328">BepInEx</text>
  <rect x="300" y="115" width="44" height="18" rx="9" fill="#1a7f37"/><text x="322" y="128" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">NEW</text>

  <use xlink:href="#folder" x="42" y="146"/><text x="72" y="161" font-size="13" fill="#1f2328">Outward Definitive Edition_Data</text>

  <rect x="30" y="175" width="330" height="26" rx="4" fill="#dafbe1"/>
  <use xlink:href="#file" x="44" y="178"/><text x="72" y="193" font-size="13" fill="#1f2328">doorstop_config.ini</text>
  <rect x="300" y="179" width="44" height="18" rx="9" fill="#1a7f37"/><text x="322" y="192" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">NEW</text>

  <use xlink:href="#exe" x="42" y="210"/><text x="72" y="225" font-size="13" fill="#1f2328">Outward Definitive Edition.exe</text>

  <rect x="30" y="239" width="330" height="26" rx="4" fill="#dafbe1"/>
  <use xlink:href="#file" x="44" y="242"/><text x="72" y="257" font-size="13" fill="#1f2328">winhttp.dll</text>
  <rect x="300" y="243" width="44" height="18" rx="9" fill="#1a7f37"/><text x="322" y="256" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">NEW</text>

  <text x="34" y="300" font-size="12" fill="#1f2328">The 3 new items sit right next to the .exe.</text>
  <text x="34" y="318" font-size="12" fill="#57606a">(Windows may hide the .exe / .dll / .ini endings.)</text>

  <!-- Wrong -->
  <rect x="390" y="44" width="350" height="286" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="404" y="68" font-size="14" font-weight="600" fill="#cf222e">✘ Wrong: one folder too deep</text>
  <rect x="404" y="80" width="322" height="24" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="414" y="97" font-size="12" fill="#57606a">… › common › Outward › Outward_Defed</text>

  <rect x="400" y="111" width="330" height="26" rx="4" fill="#ffebe9"/>
  <use xlink:href="#folder" x="412" y="114"/><text x="442" y="129" font-size="13" fill="#1f2328">BepInExPack_Outward</text>

  <path d="M422 134 V 249 M422 153 H436 M422 185 H436 M422 249 H436" stroke="#8c959f" fill="none"/>
  <use xlink:href="#folder" x="440" y="146"/><text x="470" y="161" font-size="13" fill="#57606a">BepInEx</text>
  <use xlink:href="#file" x="442" y="178"/><text x="470" y="193" font-size="13" fill="#57606a">doorstop_config.ini</text>
  <text x="470" y="221" font-size="13" fill="#57606a">…</text>
  <use xlink:href="#file" x="442" y="242"/><text x="470" y="257" font-size="13" fill="#57606a">winhttp.dll</text>

  <use xlink:href="#exe" x="412" y="274"/><text x="442" y="289" font-size="13" fill="#1f2328">Outward Definitive Edition.exe</text>

  <text x="404" y="318" font-size="12" fill="#cf222e">Inside an extra folder, BepInEx won't load.</text>
</svg>
