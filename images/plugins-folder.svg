<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="250" viewBox="0 0 760 250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <g id="file"><path d="M2 0 h10 l4 4 v14 h-14z" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><path d="M12 0 v4 h4" fill="none" stroke="#8c959f"/></g>
    <g id="zip"><path d="M0 2 h7 l2 2 h11 v12 h-20z" fill="#e3b341" stroke="#b08800" stroke-width="0.8"/><path d="M9 6 v8" stroke="#57606a" stroke-width="2" stroke-dasharray="2 1"/></g>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0969da"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="249" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#1f2328">Step 3 · Copy both DLLs into BepInEx\plugins</text>

  <!-- ZIP -->
  <rect x="20" y="44" width="250" height="190" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <use xlink:href="#zip" x="34" y="56"/><text x="62" y="71" font-size="13" font-weight="600" fill="#1f2328">Expedition-0.1.1.zip</text>
  <text x="34" y="98" font-size="12" fill="#57606a">Open the ZIP. Inside are 2 files:</text>
  <use xlink:href="#file" x="36" y="114"/><text x="62" y="129" font-size="13" fill="#1f2328">Expedition.Core.dll</text>
  <use xlink:href="#file" x="36" y="146"/><text x="62" y="161" font-size="13" fill="#1f2328">Expedition.Plugin.dll</text>
  <text x="34" y="200" font-size="12" fill="#57606a">Select both (Ctrl+A), then</text>
  <text x="34" y="218" font-size="12" fill="#57606a">Ctrl+C to copy.</text>

  <!-- Arrow -->
  <path d="M278 140 H 340" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="309" y="128" font-size="12" font-weight="600" fill="#0969da" text-anchor="middle">copy both</text>

  <!-- plugins -->
  <rect x="350" y="44" width="390" height="190" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="364" y="56" width="362" height="24" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="374" y="73" font-size="12" fill="#57606a">… › Outward_Defed › BepInEx › plugins</text>
  <text x="364" y="102" font-size="12" fill="#57606a">Paste here (Ctrl+V):</text>
  <rect x="360" y="112" width="370" height="26" rx="4" fill="#dafbe1"/>
  <use xlink:href="#file" x="374" y="116"/><text x="400" y="131" font-size="13" fill="#1f2328">Expedition.Core.dll</text>
  <rect x="360" y="144" width="370" height="26" rx="4" fill="#dafbe1"/>
  <use xlink:href="#file" x="374" y="148"/><text x="400" y="163" font-size="13" fill="#1f2328">Expedition.Plugin.dll</text>
  <text x="364" y="200" font-size="12" fill="#1f2328">Just the 2 files, not inside another folder.</text>
  <text x="364" y="218" font-size="12" fill="#57606a">No plugins folder? Start the game once with BepInEx installed.</text>
</svg>
